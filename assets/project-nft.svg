<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="245" viewBox="0 0 1200 245" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Blockchain NFT Marketplace</title>
  <desc id="desc">A decentralized application for minting, buying, and selling digital art NFTs on the blockchain.</desc>
  <defs>
