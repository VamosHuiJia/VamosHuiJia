    <text x="45" y="88" fill="#F5F0FF" font-size="32" font-weight="650">NFT Marketplace</text>
    <text x="45" y="122" fill="#BDB4D3" font-size="18">A decentralized space for digital art and ownership.</text>
    <text x="45" y="151" fill="#BDB4D3" font-size="18">Mint, buy, and sell NFTs on the blockchain.</text>
