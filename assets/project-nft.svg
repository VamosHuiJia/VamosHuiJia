    <radialGradient id="halo"><stop stop-color="#A855F7" stop-opacity=".18"/><stop offset="1" stop-color="#A855F7" stop-opacity="0"/></radialGradient>
    <linearGradient id="gem" x1="-40" y1="-50" x2="40" y2="50" gradientUnits="userSpaceOnUse"><stop stop-color="#DDD6FE"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#67E8F9"/></linearGradient>
  </defs>
